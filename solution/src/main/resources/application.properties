spring.application.name=delivery-breaker

# lets us look inside the breaker:  curl localhost:8080/actuator/circuitbreakers
management.endpoints.web.exposure.include=health,circuitbreakers

# Task 1: the settings of the circuit breaker called "courier"
# look at the last 4 calls, and do not judge before 4 calls have been made
resilience4j.circuitbreaker.instances.courier.sliding-window-size=4
resilience4j.circuitbreaker.instances.courier.minimum-number-of-calls=4
# open when 50 percent or more of them fail
resilience4j.circuitbreaker.instances.courier.failure-rate-threshold=50
# stay OPEN for 10 seconds
resilience4j.circuitbreaker.instances.courier.wait-duration-in-open-state=10s
# in HALF_OPEN, let 2 test calls through
resilience4j.circuitbreaker.instances.courier.permitted-number-of-calls-in-half-open-state=2
